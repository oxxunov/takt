name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DFN_TAG: v0.5.6          # официальный DeepFilterNet (MIT/Apache-2.0)
  SRC_TAG: 0.2.2           # libsamplerate (BSD-2)
  CRISP_SHA: bf6fbe126e4c91487494ae20b9b8fea6553f5680   # CrispASR (MIT) — рантайм Sidon на ggml
  MSST_SHA: 6fdad13686bb7e84d029ec66f9dbe76e65c93ebf   # Music-Source-Separation-Training (MIT) — код Roformer
  SIDON_SHA256: 7e27282a09be71e2f37e87731a074b291a2cab0d3f1de4a8f8eb48421587e912  # sidon-v0.1-f16.gguf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests (audio-engine)
        run: gradle :audio-engine:test --no-daemon --stacktrace

      # ---------- DeepFilterNet3: собираем официальный C API под Android ----------
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.79.0'
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Fetch DeepFilterNet
        run: |
          git clone --depth 1 --branch "$DFN_TAG" https://github.com/Rikorose/DeepFilterNet.git DeepFilterNet
          ls -la DeepFilterNet/Cargo.lock || echo "Cargo.lock нет"
          ls -la DeepFilterNet/models/DeepFilterNet3_onnx.tar.gz

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: DeepFilterNet -> target
          key: dfn-${{ env.DFN_TAG }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build libdf.so
        working-directory: DeepFilterNet
        env:
          RUSTFLAGS: -C link-arg=-Wl,-soname,libdf.so
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cargo ndk -t arm64-v8a -t x86_64 --platform 26 rustc --release -p deep_filter --features capi,tract --crate-type cdylib
          for pair in arm64-v8a:aarch64-linux-android x86_64:x86_64-linux-android; do
            abi=${pair%%:*}; triple=${pair##*:}
            mkdir -p ../ml-engine/src/main/jniLibs/$abi
            cp target/$triple/release/libdf.so ../ml-engine/src/main/jniLibs/$abi/
          done
          ls -la ../ml-engine/src/main/jniLibs/*/

      - name: Model and C API signature
        run: |
          mkdir -p ml-engine/src/main/assets ml-engine/src/main/cpp/generated
          cp DeepFilterNet/models/DeepFilterNet3_onnx.tar.gz ml-engine/src/main/assets/DeepFilterNet3_onnx.tgz
          CAPI=DeepFilterNet/libDF/src/capi.rs
          grep -q "fn df_process_frame" $CAPI
          grep -q "fn df_get_frame_length" $CAPI
          grep -A6 "fn df_create" $CAPI
          if grep -A6 "fn df_create" $CAPI | grep -q "log_level"; then
            echo "#define DF_CREATE_HAS_LOG 1" > ml-engine/src/main/cpp/generated/df_config.h
          else
            echo "/* df_create(path, atten_lim) */" > ml-engine/src/main/cpp/generated/df_config.h
          fi
          cat ml-engine/src/main/cpp/generated/df_config.h

      - name: Fetch libsamplerate
        run: git clone --depth 1 --branch "$SRC_TAG" https://github.com/libsndfile/libsamplerate.git ml-engine/src/main/cpp/libsamplerate

      # ---------- Sidon («Студийный голос»): полная модель FP16 + рантайм CrispASR ----------
      - name: Fetch CrispASR
        run: |
          set -e
          mkdir crisp && cd crisp
          git init -q
          git remote add origin https://github.com/CrispStrobe/CrispASR.git
          git fetch -q --depth 1 origin "$CRISP_SHA"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 ggml
          ls src/sidon.cpp src/sidon.h src/core/gguf_loader.cpp ggml/CMakeLists.txt

      - name: Fetch Sidon model (FP16, MIT)
        run: |
          set -e
          D=ml-engine/src/main/assets/sidon
          mkdir -p $D
          ok=0
          for attempt in 1 2 3 4 5; do
            if curl -fL --retry 3 --connect-timeout 30 -o $D/sidon-v0.1-f16.gguf \
                https://huggingface.co/KevinAHM/Sidon-GGUF/resolve/main/sidon-v0.1-f16.gguf \
               && echo "$SIDON_SHA256  $D/sidon-v0.1-f16.gguf" | sha256sum -c -; then
              ok=1; break
            fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "Модель Sidon не скачалась"; exit 1; }
          cat > $D/ATTRIBUTION.txt <<'EOT'
          Sidon v0.1 (SaruLab, The University of Tokyo) — MIT License. https://github.com/sarulab-speech/Sidon
          w2v-BERT 2.0 (Meta) and DAC decoder — MIT License.
          GGUF packaging: KevinAHM/Sidon-GGUF. Runtime: CrispASR (MIT), ggml (MIT).
          EOT
          ls -la $D

      - name: Check Sidon model on CI CPU
        run: |
          set -e
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          cmake -S ml-engine/src/main/sidon -B build-sidon-host -DCMAKE_BUILD_TYPE=Release \
            -DCRISP_DIR=$PWD/crisp -DVESIDON_HOST_CHECK=ON -DGGML_NATIVE=OFF
          cmake --build build-sidon-host -j"$(nproc)" --target host_check
          # речь + шум + эхо — как плохая запись с телефона
          ffmpeg -y -loglevel error -i crisp/samples/jfk.wav \
            -af "aecho=0.8:0.7:40|90:0.4|0.25,volume=0.7" -ar 16000 -ac 1 echo.wav
          ffmpeg -y -loglevel error -i echo.wav -f lavfi -i "anoisesrc=color=pink:amplitude=0.04:sample_rate=16000" \
            -filter_complex "[0][1]amix=inputs=2:duration=first:normalize=0" -f f32le -ar 16000 -ac 1 noisy16k.f32
          ./build-sidon-host/host_check ml-engine/src/main/assets/sidon/sidon-v0.1-f16.gguf noisy16k.f32 restored48k.f32
          mkdir -p sidon-check
          ffmpeg -y -loglevel error -f f32le -ar 16000 -ac 1 -i noisy16k.f32 sidon-check/before_16k.wav
          ffmpeg -y -loglevel error -f f32le -ar 48000 -ac 1 -i restored48k.f32 sidon-check/after_48k.wav

      - name: Upload Sidon before/after
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidon-before-after
          path: sidon-check/
          if-no-files-found: ignore

      - name: Build libvesidon.so (Android)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          build() { # abi имя-библиотеки -march
            abi=$1; name=$2; arch=$3
            extra=""
            [ -n "$arch" ] && extra="-DGGML_CPU_ARM_ARCH=$arch"
            cmake -S ml-engine/src/main/sidon -B build-sidon-$name-$abi -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release -DCRISP_DIR=$PWD/crisp -DVESIDON_NAME=$name \
              -DGGML_NATIVE=OFF $extra
            cmake --build build-sidon-$name-$abi -j"$(nproc)" --target $name
            mkdir -p ml-engine/src/main/jniLibs/$abi
            cp build-sidon-$name-$abi/lib$name.so ml-engine/src/main/jniLibs/$abi/
          }
          command -v ninja || sudo apt-get install -y ninja-build
          build arm64-v8a vesidon armv8-a
          build arm64-v8a vesidon_v82 armv8.2-a+fp16+dotprod
          build x86_64 vesidon ""
          ls -la ml-engine/src/main/jniLibs/*/

      # ---------- NVIDIA RE-USE («Универсальная очистка»): экспорт в ONNX со проверками ----------
      # Не обязательный шаг: если экспорт или проверка качества не пройдут, APK соберётся без модели.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export NVIDIA RE-USE to ONNX
        id: reuse
        continue-on-error: true
        run: |
          set -e
          python -m pip install --quiet torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet onnx==1.17.0 onnxruntime==1.19.2 numpy scipy einops safetensors librosa soundfile huggingface_hub
          python - <<'EOP'
          from huggingface_hub import snapshot_download
          snapshot_download("nvidia/NVIDIA-NemotronLabs-RE-USE", local_dir="reuse_repo",
                            allow_patterns=["*.py", "*.json", "*.safetensors", "models/*", "utils/*", "LICENSE"])
          EOP
          ls -la reuse_repo reuse_repo/models
          D=ml-engine/src/main/assets/reuse
          mkdir -p $D
          python ml-engine/reuse/export_reuse.py reuse_repo crisp/samples/jfk.wav $D/reuse.onnx $D/reuse.json
          cp reuse_repo/LICENSE $D/LICENSE.txt || true
          ls -la $D

      - name: RE-USE not included (warning)
        if: steps.reuse.outcome != 'success'
        run: |
          rm -rf ml-engine/src/main/assets/reuse
          echo "::warning::NVIDIA RE-USE не прошёл экспорт или проверку — APK собирается без него. Смотрите лог шага Export NVIDIA RE-USE."

      # ---------- becruily Mel-Roformer «Deux» (заглушка голоса): экспорт в ONNX с проверками ----------
      - name: Export Mel-Roformer Deux to ONNX
        id: deux
        continue-on-error: true
        run: |
          set -e
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet onnx==1.17.0 onnxruntime==1.19.2 numpy scipy safetensors librosa huggingface_hub pyyaml beartype==0.14.1 rotary_embedding_torch==0.3.5 einops==0.8.1 packaging
          if [ ! -d msst ]; then
            mkdir msst && cd msst
            git init -q
            git remote add origin https://github.com/ZFTurbo/Music-Source-Separation-Training.git
            git fetch -q --depth 1 origin "$MSST_SHA"
            git checkout -q FETCH_HEAD
            cd ..
          fi
          python - <<'EOP'
          from huggingface_hub import list_repo_files, hf_hub_download
          repo = "becruily/mel-band-roformer-deux"
          files = list_repo_files(repo)
          print(files)
          ck = [f for f in files if f.endswith((".ckpt", ".pth", ".safetensors"))]
          cf = [f for f in files if f.endswith((".yaml", ".yml"))]
          assert ck and cf, "нет весов или конфига"
          import shutil
          shutil.copy(hf_hub_download(repo, ck[0]), "deux" + ck[0][ck[0].rfind("."):])
          shutil.copy(hf_hub_download(repo, cf[0]), "deux.yaml")
          open("deux_ckpt_name", "w").write("deux" + ck[0][ck[0].rfind("."):])
          EOP
          D=ml-engine/src/main/assets/deux
          mkdir -p $D
          python ml-engine/roformer/export_roformer_bg.py msst deux.yaml "$(cat deux_ckpt_name)" crisp/samples/jfk.wav $D/deux_bg.onnx $D/deux.json
          printf 'becruily/mel-band-roformer-deux — CC BY-NC 4.0 (только некоммерческое использование). https://huggingface.co/becruily/mel-band-roformer-deux\nКод модели: Music-Source-Separation-Training (MIT).\n' > $D/ATTRIBUTION.txt
          rm -f deux.ckpt deux.pth deux.safetensors
          ls -la $D

      - name: Deux not included (warning)
        if: steps.deux.outcome != 'success'
        run: |
          rm -rf ml-engine/src/main/assets/deux
          echo "::warning::Mel-Roformer Deux не прошёл экспорт или проверку — APK собирается без удаления голоса в «Заглушке». Смотрите лог шага Export Mel-Roformer Deux."

      - name: Fetch LAME 3.100 (MP3)
        run: |
          # SourceForge иногда отдаёт 522 — пробуем несколько зеркал, файл проверяется по SHA-256
          SUM=ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
          ok=0
          for url in \
            https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz \
            https://deb.debian.org/debian/pool/main/l/lame/lame_3.100.orig.tar.gz \
            https://netix.dl.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz \
            https://altushost-swe.dl.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz ; do
            for attempt in 1 2 3; do
              echo "== $url (попытка $attempt)"
              if curl -fL --connect-timeout 20 --max-time 300 -o lame.tar.gz "$url" && echo "$SUM  lame.tar.gz" | sha256sum -c -; then
                ok=1; break 2
              fi
              sleep 10
            done
          done
          [ "$ok" = 1 ] || { echo "LAME не скачался ни с одного зеркала"; exit 1; }
          tar xzf lame.tar.gz
          mv lame-3.100 audio-io/src/main/cpp/lame

      # ---------- APK ----------
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # APK выкладывается как есть, без ZIP-обёртки: скачивается сразу .apk, распаковывать не нужно
      - name: Prepare APK
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk VoiceEnhance.apk
          unzip -tq VoiceEnhance.apk
          ls -la VoiceEnhance.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: VoiceEnhance.apk
          archive: false
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: audio-engine/build/reports/tests/
          if-no-files-found: ignore
